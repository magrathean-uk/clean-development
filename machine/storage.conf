# ~/dev/machine/storage.conf - clean-development 0.6.0 storage policy for this Mac. Single source.
# Read twice: sourced as POSIX sh by ~/dev/machine/env.zsh, and parsed by the clean-development runtime.
# Syntax (both readers): one KEY=value per line; comments on their own line; values may be "double" or 'single'
# quoted; only $HOME, ${HOME} and keys defined earlier in this file ($KEY or ${KEY}) are expanded. Nothing else.
# Paths must be absolute after expansion. Edit here, never in env.zsh.
STORAGE_CONF_VERSION=1

# External volume. Detected by NAME (mount point /Volumes/$EXTERNAL_VOLUME) plus a writable probe, decided once
# per agent session at session start. EXTERNAL_ROOT is the machine folder on that volume; caches live below it.
EXTERNAL_VOLUME=4TB
EXTERNAL_ROOT=/Volumes/4TB/machine
EXTERNAL_CACHE=${EXTERNAL_ROOT}/cache

# Internal fallback cache (internal disk). Disposable: no copy-back to the 4TB on reconnect.
INTERNAL_ROOT=$HOME/dev/machine/cache

# Persistent stores that only exist on the 4TB. Never redirected to internal storage.
LAB_ROOT=/Volumes/4TB/dev/lab
MODELS_ROOT=/Volumes/4TB/models

# Optional slow storage (SD card, volume name SD). Never used for routing or backups; reported by status only.
SD_VOLUME=SD

# Shared dependency caches (npm, pnpm, yarn, bun, pip, uv, cargo registry, go, gradle, HF, torch, homebrew):
# LRU cap per cache root in GB; a cache used within DEPS_MIN_IDLE_HOURS is never evicted.
DEPS_CAP_GB=30
DEPS_MIN_IDLE_HOURS=2

# Builds. External mode: kept, entries older than EXTERNAL_BUILD_DAYS pruned at most every EXTERNAL_PRUNE_EVERY_DAYS.
# Internal mode: a session's builds are deleted when it ends; anything idle for INTERNAL_BUILD_IDLE_HOURS is pruned.
EXTERNAL_BUILD_DAYS=14
EXTERNAL_PRUNE_EVERY_DAYS=7
INTERNAL_BUILD_IDLE_HOURS=24

# A session without an end marker counts as ended after this many idle hours (transcript, scratch and builds idle).
SESSION_STALE_HOURS=24

# Agents must stop and suggest waiting for the 4TB before any download or build above this size in internal mode.
BIG_DOWNLOAD_GB=5

# Warn at session start when the internal disk has less free space than this.
INTERNAL_MIN_FREE_GB=40

# No-dot-folder policy: report only, never delete. Space-separated names allowed directly in ~ and ~/dev.
# .warp: Warp keeps themes and launch configs there. .thumbnails: Blender hardcodes it. .cups, .Trash, .zsh_sessions: macOS.
# .aws: aws-cli writes cli/ and sso/ caches there whatever AWS_CONFIG_FILE says. .insightface: insightface hard-codes
# its model root (porn tooling). .opencode: opencode2's install directory.
HOME_DOT_ALLOW=".agents .aws .cache .claude .codex .config .cups .gnupg .insightface .local .opencode .ssh .thumbnails .Trash .warp .zsh_sessions"
HOME_DOTFILE_ALLOW=".CFUserTextEncoding .DS_Store .claude.json .claude.json.backup .gitconfig .zcompdump .zprofile .zsh_history .zshenv .zshrc"
DEV_DOT_ALLOW=".DS_Store"
