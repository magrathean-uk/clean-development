# Sample storage policy for Clean Development 0.6.8. Review and edit it for your machine before installation.
# Parsed as data by the environment script and runtime. Never executed.
# Syntax (both readers): one KEY=value per line; comments on their own line; values may be "double" or 'single'
# quoted; only $HOME, ${HOME} and keys defined earlier in this file ($KEY or ${KEY}) are expanded. Nothing else.
# Paths must be absolute without . or .. components; numeric values are non-negative plain decimals.
# Edit here, never in env.zsh. Unknown keys/unsafe syntax disable cleanup and select safe internal routing.
STORAGE_CONF_VERSION=1

# External volume. Detected by NAME (mount point /Volumes/$EXTERNAL_VOLUME) plus a writable probe, by every shell
# (storage follows the drive). EXTERNAL_ROOT is the machine folder on that volume; caches live below it.
EXTERNAL_VOLUME=External
EXTERNAL_ROOT=/Volumes/External/dev
EXTERNAL_CACHE=${EXTERNAL_ROOT}/cache

# Internal fallback cache (internal disk). Disposable; it is not copied back when external storage returns.
INTERNAL_ROOT=$HOME/dev/machine/cache

# Persistent stores that only exist on the external volume. Never redirected to internal storage.
LAB_ROOT=/Volumes/External/dev/lab
MODELS_ROOT=/Volumes/External/models

# Optional slow volume for reporting only. Leave blank when unused; it is never used for routing or backups.
SD_VOLUME=

# Shared cache locations managed by env.zsh (npm, pnpm, Yarn Classic, Bun, pip, uv, Go, Hugging Face hub/assets,
# PyTorch, NuGet, Playwright and Homebrew). Toolchain and application homes are left to the host:
# Best-effort stale-mtime cap per root in GB, not a strict quota or read-activity LRU.
# Recent shallow writes are protected; deep writes/reads require an explicit consumer lease.
DEPS_CAP_GB=30
DEPS_MIN_IDLE_HOURS=2

# Builds. External mode: kept, entries older than EXTERNAL_BUILD_DAYS pruned at most every EXTERNAL_PRUNE_EVERY_DAYS.
# Internal mode: a session's builds are deleted when it ends; anything idle for INTERNAL_BUILD_IDLE_HOURS is pruned.
EXTERNAL_BUILD_DAYS=14
EXTERNAL_PRUNE_EVERY_DAYS=7
INTERNAL_BUILD_IDLE_HOURS=24

# A session without an end marker counts as ended after this many idle hours (transcript, scratch and builds idle).
SESSION_STALE_HOURS=24

# Agents should wait for external storage before any download or build above this size in internal mode.
BIG_DOWNLOAD_GB=5

# Warn at session start when the internal disk has less free space than this.
INTERNAL_MIN_FREE_GB=40

# Report unexpected names only; this policy never deletes them. Adjust these example allowlists for your setup.
DEV_TOP_ALLOW="machine source"
HOME_DOT_ALLOW=".agents .aws .cache .claude .codex .config .cups .gnupg .local .opencode .ssh .thumbnails .Trash .warp .zsh_sessions"
HOME_DOTFILE_ALLOW=".CFUserTextEncoding .DS_Store .claude.json .claude.json.backup .gitconfig .zcompdump .zprofile .zsh_history .zshenv .zshrc"
DEV_DOT_ALLOW=".DS_Store"
