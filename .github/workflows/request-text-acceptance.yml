name: Request text acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/request-text-acceptance.yml'
      - 'scripts/request-acceptance/**'
      - 'test/request-acceptance.test.js'
      - 'marketplace/claude/**'
      - 'src/integrations.js'
      - 'docs/request-text-acceptance.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-request-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Measurement apparatus controls (not host acceptance)
        run: node --test test/request-acceptance.test.js
      - name: Install the exact real host into disposable storage
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/request-host-home" "$RUNNER_TEMP/request-host-cache"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/request-host-home" \
            npm_config_cache="$RUNNER_TEMP/request-host-cache" \
            npm install --prefix "$RUNNER_TEMP/request-host" --ignore-scripts --no-audit --no-fund \
            @anthropic-ai/claude-code@2.1.283
          node -e 'const fs=require("fs"),c=require("crypto"),p=process.argv[1];const b=fs.readFileSync(p);const m=JSON.parse(b);if(m.name!=="@anthropic-ai/claude-code"||m.version!=="2.1.283")process.exit(1);console.log(JSON.stringify({package:m.name,version:m.version,manifestSha256:c.createHash("sha256").update(b).digest("hex")}));' \
            "$RUNNER_TEMP/request-host/node_modules/@anthropic-ai/claude-code/package.json"
          sha256sum "$RUNNER_TEMP/request-host/package-lock.json"
          # The pinned host's launcher requires this documented native install step.
          # Run only that installer, not arbitrary dependency lifecycle scripts.
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/request-host-home" \
            npm_config_cache="$RUNNER_TEMP/request-host-cache" \
            node "$RUNNER_TEMP/request-host/node_modules/@anthropic-ai/claude-code/install.cjs"
      - name: Version-only startup diagnostics (not a request capture)
        env:
          HOST_BINARY: ${{ runner.temp }}/request-host/node_modules/.bin/claude
          VERSION_LAB: ${{ runner.temp }}/request-version-diagnostic
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {isolatedEnvironment,prepareDirectories,runChild} from './scripts/request-acceptance/run.mjs';
          import {redact} from './scripts/request-acceptance/capture.mjs';
          const binary=fs.realpathSync(process.env.HOST_BINARY),lab=process.env.VERSION_LAB;
          const env=isolatedEnvironment(lab,path.dirname(process.env.HOST_BINARY));prepareDirectories(lab,env);
          const result=await runChild(binary,['--version'],{cwd:lab,env,timeoutMs:10000,maxBytes:16384});
          const value=redact(result,[[lab,'<VERSION_LAB>'],[path.dirname(binary),'<HOST_PACKAGE>'],[process.env.RUNNER_TEMP,'<RUNNER_TEMP>']]).value;
          console.log(JSON.stringify({exitCode:value.code,signal:value.signal,failure:value.failure,stdout:value.stdout.slice(0,512),stderr:value.stderr.slice(0,1024)},null,2));
          JS
      - name: Actual Claude requests to documented loopback gateway (no provider account)
        run: |
          node scripts/request-acceptance/run.mjs \
            --claude "$RUNNER_TEMP/request-host/node_modules/.bin/claude" \
            --expect-version 2.1.283 --repeats 2 \
            --output "$RUNNER_TEMP/request-text-evidence"
      - name: Publish only the bounded comparison index, never request bodies or CLI logs
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/request-text-evidence/report.json
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if (!fs.existsSync(process.env.EVIDENCE)) {
            console.log(JSON.stringify({requestText:'unproven',reason:'host experiment did not produce evidence',billedTokens:'unproven'}));
          } else {
            const r=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));
            console.log(JSON.stringify({source:r.source,environment:r.environment,targetHostVersion:r.targetHostVersion,observedHostVersion:r.observedHostVersion,hostBinarySha256:r.hostBinarySha256,hostCasesExecuted:r.hostCasesExecuted,blocker:r.blocker,claims:r.claims,sourceUnchanged:r.sourceUnchanged,binaryUnchanged:r.binaryUnchanged,evaluation:r.evaluation,cases:r.cases.map(c=>({name:c.name,repeat:c.repeat,status:c.status,reason:c.reason,process:c.process,nativeHookObserved:c.nativeHookObserved,captureErrors:c.captureErrors,requests:c.requests.map(q=>({endpoint:q.endpoint,rawSha256:q.rawSha256,rawBytes:q.rawBytes,observation:q.observation}))}))},null,2));
          }
          JS
