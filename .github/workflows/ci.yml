name: Source checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.12.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - name: Test isolated homes and volumes
        shell: bash
        run: |
          export CLEAN_DEV_TEST_DIR="$(mktemp -d "$RUNNER_TEMP/clean-development.XXXXXX")"
          export CLEAN_DEV_TEST_PYTHON="$(command -v python3)"
          npm test
