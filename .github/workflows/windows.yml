name: Windows contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-contract:
    name: Native Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Native lifecycle, launchers, real tools and process-tree cleanup
        run: node --test test/windows-contract.test.js
      - name: Existing native batch argument contract
        if: ${{ !cancelled() }}
        run: node --test --test-name-pattern="Windows batch" test/runtime-regressions.test.js
      - name: Extended batch and native argument contract
        if: ${{ !cancelled() }}
        run: node --test test/windows-argv.test.js
      - name: Foreground child lifecycle and failed launch cleanup
        if: ${{ !cancelled() }}
        run: node --test test/process-runner.test.js
      - name: Executable discovery and relative cwd contracts
        if: ${{ !cancelled() }}
        run: node --test test/executable.test.js
      - name: Portable inspection, storage and probe contracts
        if: ${{ !cancelled() }}
        run: node --test test/measurement.test.js test/status.test.js test/inspection.test.js test/bounded-leases.test.js test/probe.test.js test/probe-process.test.js test/marketplace-portability.test.js
