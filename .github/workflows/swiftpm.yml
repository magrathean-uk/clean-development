name: SwiftPM adapter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swiftpm:
    name: Real SwiftPM / macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Deterministic SwiftPM contract
        run: node --test test/swiftpm.test.js test/config.test.js
      - name: Required real Swift builds, tests and retained output
        env:
          CLEAN_DEVELOPMENT_REAL_SWIFT: '1'
        run: node --test test/swiftpm-real.test.js
