name: Bug report
description: Report reproducible routing, setup, or compatibility behavior
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the private route in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and agent
      placeholder: macOS 15, Codex CLI
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
      description: Remove secrets and private paths. Include the smallest command sequence.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized status and doctor output
      render: shell
