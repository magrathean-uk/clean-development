name: Bug report
description: Report reproducible routing, setup, or compatibility behavior
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not post vulnerability details here. Read https://github.com/magrathean-uk/clean-development/blob/main/.github/SECURITY.md for the reporting policy.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and agent
      placeholder: macOS 15, Codex CLI
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
      description: Remove secrets, prompts, account data, and private paths. Include the smallest command sequence and the selected session mode.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized status and doctor output, including exit codes
      render: shell
